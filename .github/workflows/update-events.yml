# Canopy: daily event update
# Save this file in your repository as:  .github/workflows/update-events.yml
# It runs scripts/update-events.mjs every morning, then commits any new events
# (auto-events.js) and map coordinates (geocache.json). Cloudflare Pages
# republishes the site automatically after each commit.

name: Update events

on:
  schedule:
    - cron: "17 11 * * *"    # every day at 11:17 UTC (about 6:17am Chicago time)
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write             # lets the workflow commit the updated files

concurrency:
  group: update-events        # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull events from calendar feeds
        run: node scripts/update-events.mjs

      - name: Check group source links
        run: node scripts/check-group-links.mjs

      - name: Preserve event history and permanent URLs
        run: node build-site.mjs

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-events.js geocache.json group-link-audit.json event-archive.json event-identities.json
          if git diff --cached --quiet; then
            echo "No new events today."
            exit 0
          fi
          git commit -m "Update events from calendar feeds"
          git push
